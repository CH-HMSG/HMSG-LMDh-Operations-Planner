<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMSG Cal Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root{
  --bg:#111213;--surf:#17181a;--surf2:#1c1d20;--surf3:#24262a;--line:#2d3034;--line2:#3a3d42;--row:#1f2023;
  --text:#d6d8db;--text2:#b4b8bd;--muted:#7c8086;--faint:#5e6268;
  --pri:#4f98a3;--pri-bg:#182a2d;--pri-t:#8cc7cf;--link:#6fb3bd;
  --ok:#4fc87a;--ok-bg:#17251d;--ok-l:#2b5a3a;
  --warn:#fdab43;--warn-bg:#262420;--warn-l:#5c4420;
  --bad:#e05c6a;--bad-bg:#2a1b1e;--bad-l:#a13544;
  --mono:Inter,system-ui,sans-serif;
}
input[type=checkbox]{accent-color:var(--pri)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif}
a{color:var(--link)}a:hover{color:var(--pri-t)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){background:var(--surf3)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.pri:hover:not(:disabled){background:#3a8290}
.btn.out{border-color:var(--pri);color:var(--pri-t)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger{border-color:var(--bad-l);color:var(--bad)}
.inp{height:36px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--text);outline:0}
.inp:focus{border-color:var(--pri)}
textarea.inp{height:auto;padding:9px 11px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:#24262a;color:#b4b8bd;font-size:11px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-draft{background:var(--warn-bg);color:var(--warn)}
.b-signed{background:var(--ok-bg);color:var(--ok)}
.b-legacy{background:#24262a;color:var(--muted)}
.b-dnu{background:var(--bad-bg);color:var(--bad)}
.b-active{background:var(--pri-bg);color:var(--pri-t)}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surf2)}
.lbl{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.text2{color:var(--text2)}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-pri{color:var(--link)}

/* header */
#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 22px;min-height:56px;border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.logo{width:24px;height:24px;border-radius:5px;background:linear-gradient(135deg,#4f98a3,#2c6870);display:grid;place-items:center}
.logo svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#nav{display:flex;gap:4px;flex-wrap:wrap}
#nav button{padding:8px 12px;border-radius:6px;border:0;background:transparent;color:var(--muted)}
#nav button.on{background:#24262a;color:var(--text);font-weight:600}
#nav button:hover{color:var(--text)}
.toprt{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#151618;max-width:460px}
.dot{width:8px;height:8px;border-radius:50%;background:#a13544;flex-shrink:0}
.dot.on{background:#4fc87a}.dot.busy{background:var(--warn)}
.pill .proj{color:var(--faint);font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-sm{padding:2px 6px;border-radius:4px;background:var(--line);color:var(--muted);font-size:11px}
.tag-sm.live{background:#5c4420;color:#ffd08a}
.avatar{width:30px;height:30px;border-radius:50%;background:#24262a;display:grid;place-items:center;font-weight:600;font-size:11px;border:0;color:var(--text)}

main{width:100%;margin:0;padding:20px 22px 40px}
.row{display:flex;flex-wrap:wrap;gap:20px}
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.hdr h1{margin:0 8px 0 0;font-size:20px}

/* library */
.side{flex:1 1 220px;max-width:260px;display:flex;flex-direction:column;gap:22px}
.side .opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);color:var(--text2);cursor:pointer}
.side .opt.on{border-color:var(--pri);background:var(--pri-bg);color:var(--text)}
.side .opt span:nth-child(2){flex:1}
.legend{display:flex;flex-direction:column;gap:5px;color:#8a8e94;font-size:11px;line-height:1.45}
.tagbtn{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text2);font-size:12px}
.tagbtn.on{border-color:var(--pri);background:var(--pri-bg);color:var(--pri-t)}
.listwrap{flex:999 1 640px;min-width:0}
.tbl{border:1px solid var(--line);border-radius:10px;background:var(--surf2);overflow-x:auto}
.tbl-in{min-width:900px}
.lrow{display:grid;grid-template-columns:2.6fr 1.4fr 1.5fr .5fr 1.1fr 1fr .5fr;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--row);cursor:pointer}
.lrow.h{cursor:default;padding:10px 16px;color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;border-bottom-color:var(--line)}
.lrow:not(.h):hover{background:#202226}
.lrow.legacy{opacity:.72}
.lrow.dnu .nm{color:var(--bad)}
.lrow .nm{font-weight:600;font-size:14px}
.lrow .ds{color:#8a8e94;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* set page */
.crumb{color:var(--faint);font-size:12px;margin-bottom:12px}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer}
.sethead{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.sethead h1{margin:0;font-size:26px}
.metagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:16px 0 20px}
.metagrid>div{background:var(--surf2);padding:11px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.metagrid .v{overflow-wrap:anywhere}
.items .it{display:grid;grid-template-columns:24px minmax(0,2.6fr) .55fr .9fr 1.25fr;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--row);cursor:pointer}
.items .it:hover{background:#202226}
.items .it.sel{background:#1f3a3e}
.items .it .n{font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items .it .note{padding:0;border:0;color:var(--faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.split{flex-wrap:nowrap;gap:0}
.splitter{flex:0 0 16px;cursor:col-resize;position:relative;touch-action:none;outline:0}
.splitter::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--line)}
.splitter::after{content:"";position:absolute;left:5px;top:50%;width:6px;height:36px;margin-top:-18px;border-radius:3px;background:var(--line2)}
.splitter:hover::before,.splitter:hover::after,.splitter:focus-visible::before,.splitter.drag::before,.splitter.drag::after{background:var(--pri)}
@media (max-width:900px){.row.split{flex-wrap:wrap;gap:20px}.splitter{display:none}.split-left{flex:1 1 100%!important}}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-f{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px}
.seg button{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px}
.seg button.on{border-color:var(--line2);background:var(--surf3);color:var(--text)}

/* map grid */
.gridwrap{overflow:auto;max-height:560px;padding:12px 14px}
table.mg{border-collapse:separate;border-spacing:0;width:max-content;table-layout:fixed;font-family:Inter,sans-serif;border-top:1px solid var(--line);border-left:1px solid var(--line)}
table.mg th,table.mg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:24px;padding:0 2px;box-sizing:border-box;overflow:hidden;white-space:nowrap}
table.mg th{position:sticky;top:0;z-index:2;background:var(--surf2);width:52px;min-width:52px;max-width:52px;text-align:center;font:600 11px/1 Inter,sans-serif;color:var(--muted)}
table.mg th.ya{left:0;z-index:1;width:64px;min-width:64px;max-width:64px}
table.mg tr:first-child th.ya{z-index:3;font-size:9px;color:var(--faint)}
table.mg td{width:52px;min-width:52px;max-width:52px;text-align:center;font:500 12px/1 Inter,sans-serif;color:var(--text)}
table.mg td.df{box-shadow:inset 0 0 0 2px #fff}
table.mg td.dz{background:var(--surf);color:var(--muted)}
table.mg th.c-bad{color:var(--bad)}
.scalar{padding:28px 14px;font-family:Inter,sans-serif;font-weight:500;font-size:30px}
.plot3d{height:460px}

/* compare */
.pick{flex:1 1 320px;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:var(--surf);display:flex;flex-direction:column;gap:7px}
.pick select{height:36px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;align-items:center}
.stat{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
.stat b{font-size:18px;margin-right:4px}
.cmpitem{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid var(--row);border-left:3px solid transparent;cursor:pointer}
.cmpitem:hover{background:#202226}
.cmpitem.sel{background:#1f3a3e}
.triple{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px 14px}
.triple .gridwrap{padding:0;max-height:440px}
.triple.stack{grid-template-columns:minmax(0,1fr);gap:18px}
.triple.stack .gridwrap{max-height:none}

/* capture */
.step{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:12px}
.step i{width:26px;height:26px;border-radius:50%;background:var(--pri);display:grid;place-items:center;font-style:normal;font-size:12px}
.crow{display:grid;grid-template-columns:minmax(0,2.4fr) .6fr .9fr 1.3fr minmax(0,1.2fr) 28px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--row)}
.crow.h{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;border-bottom-color:var(--line)}
.crow .inp{height:30px;font-size:12px}
.x{width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--faint)}
.x:hover{background:var(--surf3);color:var(--text)}
.form{display:flex;flex-direction:column;gap:13px;padding:16px}
.form label{display:flex;flex-direction:column;gap:6px}
.form label>span:first-child{color:var(--muted);font-size:12px}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px;min-height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--bg)}
.tagbox input{flex:1;min-width:120px;background:transparent;border:0;outline:0;height:24px}
.tagbox .chip button{border:0;background:transparent;color:var(--faint);padding:0;font-size:12px}

/* dialog + toast */
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
#dlg.on{display:flex}
.dlg{width:100%;max-width:820px;border:1px solid var(--line2);border-radius:14px;background:var(--surf);overflow:hidden}
.dlg.narrow{max-width:520px}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0 0 4px;font-size:17px}
.dlg-b{padding:14px 20px;display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.note{padding:11px 13px;border-radius:10px;line-height:1.5}
.note.warn{border:1px solid #6b5226;background:rgba(253,171,67,.08);color:#f0c27a}
.note.info{border:1px solid #1f3a3e;background:#16262a;color:#a9d3d9}
.note.bad{border:1px solid var(--bad-l);background:rgba(224,92,106,.06);color:var(--bad)}
.note.ok{border:1px solid var(--ok-l);background:rgba(79,200,122,.06);color:#8fdcaa}
.srow{display:grid;grid-template-columns:minmax(0,2.3fr) .6fr minmax(0,2fr);gap:10px;padding:9px 13px;border-top:1px solid var(--row)}
.srow.h{border-top:0;color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;background:var(--surf2)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{padding:10px 16px;border-radius:9px;background:#24262a;border:1px solid var(--line2);box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:640px}
#toast div.bad{border-color:var(--bad-l);color:var(--bad)}
#toast div.ok{border-color:var(--ok-l);color:#8fdcaa}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--pri-t);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:700px){main{padding:14px}#top{padding:8px 14px}.side{max-width:none}}
</style>
</head>
<body>
<header id="top">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 10 7l4 7 6-10"/><path d="M4 20h16"/></svg></div>HMSG Cal Library</div>
  <nav id="nav">
    <button data-go="library">Library</button>
    <button data-go="compare">Compare</button>
    <button data-go="capture">Capture from SM</button>
    <button data-go="restore">Restore points</button>
  </nav>
  <div class="toprt">
    <div class="pill" id="smPill" title=""><span class="dot" id="smDot"></span><span id="smTxt">SM link: checking…</span><span class="proj" id="smProj"></span><span class="tag-sm" id="smOn" style="display:none"></span></div>
    <button class="avatar" id="userBtn" title="GitHub settings">?</button>
  </div>
</header>
<main id="main"></main>
<div id="dlg"></div>
<div id="toast"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
//  HMSG Cal Library — cal sets in a private GitHub repo, sent to
//  System Monitor through the local HMSG SM Link helper (127.0.0.1:8765).
// ════════════════════════════════════════════════════════════════════
const APPVER = '1.0';
const HELPER = (location.hostname === '127.0.0.1' && location.port === '8765') ? '' : 'http://127.0.0.1:8765';
const DIR = 'calsets';
const KIND = { '2AXIS': '3D map', '1AXIS': 'Curve', 'AXIS': 'Axis', 'SCALAR': 'Scalar' };
const STATUS = {
  active:   { label: 'Active',     cls: 'b-active', hint: 'current, use these' },
  legacy:   { label: 'Legacy',     cls: 'b-legacy', hint: 'older but still usable; shown greyed' },
  donotuse: { label: 'Do not use', cls: 'b-dnu',    hint: 'kept for reference only; hidden by default, can be viewed and compared but not sent to SM' }
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f32 = v => Math.fround(v);
const fmtNum = v => { if (v === null || v === undefined || !isFinite(v)) return '—'; const r = +f32(v).toPrecision(7); return String(r); };
const today = () => new Date().toISOString();
const fmtDate = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' }); };
const fmtDT = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString(undefined, { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const store = {
  get(k, d) { try { const v = localStorage.getItem('hmsg.cal.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('hmsg.cal.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('hmsg.cal.' + k); } catch {} }
};

function toast(msg, cls = '') {
  const d = document.createElement('div'); d.className = cls; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), cls === 'bad' ? 7000 : 4000);
}

// ───────────── state ─────────────
const S = {
  cfg: store.get('cfg', { owner: 'CH-HMSG', repo: 'HMSG-LMDh-Cal-Library', token: '' }),
  user: null,
  sets: [], loaded: false, loading: false, loadErr: '',
  view: 'library',
  lib: store.get('libFilters', { st: { active: true, legacy: true, donotuse: false }, tags: [], q: '', sort: 'new' }),
  setId: null, set: null, setSha: null, selItem: 0, itemView: 'table', checked: new Set(), smCmp: null, smCmpBusy: false,
  cmp: { a: '', b: '', res: null, sel: 0, only: true, view: 'side', busy: false },
  cap: store.get('captureDraft', null) || newCapture(),
  helper: { ok: false, status: null, index: [], indexVer: -1, byName: new Map() },
  restore: { list: null, busy: false }
};
function newCapture() { return { items: [], mode: 'new', target: '', name: '', desc: '', tags: [], msg: '', keep: true, savedAt: null }; }
function saveDraft() { S.cap.savedAt = today(); store.set('captureDraft', S.cap); }

// ───────────── SM link helper ─────────────
async function helper(path, body) {
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) } : {};
  if (HELPER) opt.targetAddressSpace = 'loopback';
  const r = await fetch(HELPER + path, opt);
  return r.json();
}
async function pollHelper() {
  try {
    const s = await helper('/api/status');
    S.helper.ok = !!s.connected; S.helper.status = s;
    if (s.connected && s.indexVer !== S.helper.indexVer) {
      const d = await helper('/api/index');
      if (d.ok) {
        S.helper.index = d.items; S.helper.indexVer = d.ver; S.helper.byName = new Map();
        d.items.forEach(e => { const k = e[0].toLowerCase(); if (!S.helper.byName.has(k)) S.helper.byName.set(k, []); S.helper.byName.get(k).push(e); });
        const dl = document.getElementById('smNames'); if (dl) fillNames(dl);
      }
    }
  } catch { S.helper.ok = false; S.helper.status = null; }
  paintHelper();
}
function paintHelper() {
  const s = S.helper.status, dot = $('#smDot'), txt = $('#smTxt'), pr = $('#smProj'), on = $('#smOn');
  if (!s) { dot.className = 'dot'; txt.textContent = 'SM link not running — start HMSG_SM_Link.bat'; pr.textContent = ''; on.style.display = 'none'; return; }
  if (!s.connected) { dot.className = 'dot'; txt.textContent = 'System Monitor: ' + (s.error || 'not connected'); pr.textContent = ''; on.style.display = 'none'; return; }
  dot.className = 'dot on'; txt.textContent = 'SM connected';
  pr.textContent = (s.project || '').split(/[\\/]/).pop(); $('#smPill').title = s.project || '';
  if (s.online === null || s.online === undefined) on.style.display = 'none';
  else { on.style.display = ''; on.className = 'tag-sm' + (s.live ? ' live' : ''); on.textContent = s.live ? 'LIVE' : (s.online ? 'Online' : 'Offline'); }
}
function smProjectName() { return S.helper.status?.project || ''; }
function needHelper() { if (!S.helper.ok) { toast('Not connected to System Monitor — start HMSG_SM_Link.bat and open a project in SM.', 'bad'); return false; } return true; }

// ───────────── GitHub ─────────────
const GH = 'https://api.github.com';
function ghHeaders(raw) {
  const h = { 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };

// draggable divider between the Items list and the item panel (width remembered per browser)
function splitW() { return store.get('splitW', Math.round(Math.max(360, (innerWidth - 60) * 0.45))); }
function initSplitter() {
  const sp = $('#splitter'), left = $('#splitLeft'), row = $('#splitRow'); if (!sp || !left || !row) return;
  const clamp = w => Math.max(300, Math.min(w, row.getBoundingClientRect().width - 16 - 360));
  const setW = (w, save) => { w = Math.round(clamp(w)); left.style.flexBasis = w + 'px'; if (save) { store.set('splitW', w); const p = $('#plot'); if (p && window.Plotly) Plotly.Plots.resize(p); } };
  setW(splitW(), false);
  sp.onpointerdown = e => {
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('drag');
    const x0 = row.getBoundingClientRect().left;
    sp.onpointermove = ev => setW(ev.clientX - x0 - 8, false);
    sp.onpointerup = ev => { sp.classList.remove('drag'); sp.onpointermove = sp.onpointerup = null; setW(ev.clientX - x0 - 8, true); };
  };
  sp.onkeydown = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setW(left.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? -40 : 40), true); } };
}
function itemBodyHTML(s, it) {

    if (!S.helper.ok) return '<div class="empty">Connect to System Monitor to compare.</div>';
    if (!sm) return '<div class="empty"><span class="spin"></span></div>';
    if (!sm.ok) return `<div class="empty c-bad">${esc(sm.error)}</div>`;
    const d = diffItem(sm, it);
    if (d.st === 'size') return `<div class="empty c-bad">${esc(d.txt)}</div>`;
    return `<div class="triple${it.kind === 'SCALAR' ? '' : ' stack'}"><div><div style="font-weight:600;margin-bottom:6px">SM now</div><div class="gridwrap">${gridHTML(sm)}</div></div>
      <div><div style="font-weight:600;margin-bottom:6px">This cal set</div><div class="gridwrap">${gridHTML(it)}</div></div>
      <div>${diffHead('Difference (cal set − SM)', 'set', sm, it)}<div class="gridwrap" data-diffk="set">${diffGridHTML(sm, it)}</div></div></div>`;
  }
  const i = s.items.indexOf(it), sm = S.smCmpSm?.[i]; let dc = null;
  if (sm && sm.ok && sameShape(sm, it)) { const a = flatVals(sm), b = flatVals(it); dc = new Set(); a.forEach((v, k) => { if (f32(v) !== f32(b[k])) dc.add(k); }); }

}

  const rec = { ...next, _sha: newSha, _path: `${DIR}/${next.id}.json` };
  if (i >= 0) S.sets[i] = rec; else S.sets.push(rec);
  store.del('setCache');

}

function srcLabel(src) {
  if (!src) return '';
  const [t, rest] = [src.slice(0, src.indexOf(':')), src.slice(src.indexOf(':') + 1)];
  if (t === 'set') { const s = setById(rest); return s ? `${s.name} v${s.version || 1}` : rest; }
  if (t === 'sm') return 'SM now';
  if (t === 'ver') { const [id, sha] = rest.split('@'); const s = setById(id); return `${s ? s.name : id} @ ${sha.slice(0, 7)}`; }

async function loadSource(src, otherItems) {
  const t = src.slice(0, src.indexOf(':')), rest = src.slice(src.indexOf(':') + 1);
  if (t === 'set') { const s = setById(rest); if (!s) throw new Error('Cal set not found'); return { items: s.items, status: s.status, set: s }; }
  if (t === 'ver') { const [id, sha] = rest.split('@'); const d = JSON.parse(await gh(repoPath(`/contents/${DIR}/${encodeURIComponent(id)}.json?ref=${sha}`), { raw: true })); return { items: d.items, status: d.status, ver: true }; }
  if (t === 'sm') {
    if (!S.helper.ok) throw new Error('System Monitor is not connected');
    if (!otherItems) throw new Error('Choose a cal set or version on the other side — SM is read for those items.');
    const base = otherItems;
    const r = await helper('/api/readmany', { items: base.map(i => ({ name: i.name, app: i.app })) });
    return { items: r.items.filter(x => x.ok).map(stripItem), sm: true, missing: r.items.filter(x => !x.ok).map(x => x.name) };
  }
  throw new Error('Unknown source');
}
async function runCompare() {
  const c = S.cmp; if (!c.a || !c.b) { renderCompare(); return; }
  c.busy = true; c.res = null; renderCompare();
  try {
    let A, B;
    if (c.a.startsWith('sm:') && c.b.startsWith('sm:')) throw new Error('A and B are both SM — choose a cal set on one side.');
    if (c.a.startsWith('sm:')) { B = await loadSource(c.b); A = await loadSource(c.a, B.items); }
    else { A = await loadSource(c.a); B = await loadSource(c.b, A.items); }
    const mA = new Map(A.items.map(i => [itemKey(i), i])), mB = new Map(B.items.map(i => [itemKey(i), i]));
    const keys = [...new Set([...mA.keys(), ...mB.keys()])];
    const rows = keys.map(k => { const a = mA.get(k), b = mB.get(k); const it = a || b;
      if (!a) return { k, name: it.name, app: it.app, a, b, st: 'onlyB', txt: A.sm ? 'Not in open SM project' : 'Only in B' };
      if (!b) return { k, name: it.name, app: it.app, a, b, st: 'onlyA', txt: B.sm ? 'Not in open SM project' : 'Only in A' };
      return { k, name: it.name, app: it.app, a, b, ...diffItem(a, b) }; });

    c.res = { rows, A, B }; c.sel = 0;

}

function srcStatus(src) {

function fillNames(dl) { dl.innerHTML = S.helper.index.map(e => `<option value="${esc(e[0])}" label="${esc(e[1] + ' · ' + KIND[e[3]])}"></option>`).join(''); }

    if (S.cap.items.some(x => x.name.toLowerCase() === n.toLowerCase() && (!app || x.app === app))) return;
    S.cap.items.push({ name: hits[0]?.[0] || n, app, kind: hits.length === 1 ? hits[0][3] : '', note: '', apps: hits.length > 1 ? hits.map(h => h[1]) : null });
    added++;

async function saveCapture() {
  const c = S.cap;
  const ready = c.items.filter(x => x.data);
  if (!ready.length) { toast('Read the items from SM first.', 'bad'); return; }
  if (c.items.some(x => !x.data)) { if (!confirm(`${c.items.length - ready.length} item(s) were not read and will be left out. Save the other ${ready.length}?`)) return; }
  if (!c.name.trim()) { toast('Give the cal set a name.', 'bad'); $('#nm').focus(); return; }
  if (!c.msg.trim()) { toast('Write what changed (version message).', 'bad'); $('#msg').focus(); return; }
  const items = ready.map(x => ({ ...x.data, note: x.note || '' }));
  let next, sha = null, msg;
  if (c.mode === 'version') {
    const t = setById(c.target); if (!t) { toast('Choose the cal set to update.', 'bad'); return; }
    if (isSigned(t)) { toast('That cal set is signed off — duplicate it to make changes.', 'bad'); return; }

    if (c.keep !== false) { const got = new Set(items.map(itemKey)); merged = [...t.items.filter(x => !got.has(itemKey(x))), ...items]; const order = new Map(t.items.map((x, i) => [itemKey(x), i])); merged.sort((a, b) => (order.get(itemKey(a)) ?? 1e9) - (order.get(itemKey(b)) ?? 1e9)); }
    next = { ...strip(t), name: c.name.trim(), description: c.desc, tags: c.tags, items: merged, version: (t.version || 1) + 1, modified: today(), modifiedBy: userName(), versionMessage: c.msg.trim(), source: { project: c.readProject || smProjectName(), readAt: c.readAt } };
    sha = t._sha; msg = `${next.name} v${next.version}: ${c.msg.trim()}`;
  } else {
    next = { format: 'hmsg-calset/1', id: slug(c.name.trim()), name: c.name.trim(), description: c.desc, tags: c.tags, status: 'active', signoff: null, version: 1, author: userName(), created: today(), modified: today(), modifiedBy: userName(), versionMessage: c.msg.trim(), source: { project: c.readProject || smProjectName(), readAt: c.readAt }, items };
    msg = `New cal set ${next.name}: ${c.msg.trim()}`;
  }
  const btn = $('#saveBtn'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving…';
  try { await saveSet(next, sha, msg); S.cap = newCapture(); store.del('captureDraft'); toast(`Saved ${next.name} v${next.version}.`, 'ok'); go('set', next.id); }
  catch (e) { toast(e.message, 'bad'); btn.disabled = false; btn.textContent = 'Save to library'; }
}

// ───────────── RESTORE POINTS ─────────────
async function renderRestore() {
  const R = S.restore;
  $('#main').innerHTML = `<div class="hdr"><h1>Restore points</h1><span class="muted">Saved automatically on this PC before every send to SM. Undo puts SM back exactly as it was.</span><button class="btn sm" id="rrl" style="margin-left:auto">↻</button></div>
    <div id="rpl">${!S.helper.status ? '<div class="note bad">The SM link is not running — start HMSG_SM_Link.bat.</div>' : '<div class="empty"><span class="spin"></span></div>'}</div>`;
  $('#rrl').onclick = () => { S.restore.list = null; renderRestore(); };
  if (!S.helper.status) return;
  if (!R.list) { try { R.list = await helper('/api/restorepoints'); } catch { R.list = { ok: false, error: 'SM link not responding' }; } }
  if (S.view !== 'restore') return;
  const L = R.list;
  if (!L.ok) { $('#rpl').innerHTML = `<div class="note bad">${esc(L.error)}</div>`; return; }
  $('#rpl').innerHTML = `<div class="tbl"><div style="min-width:760px">
    ${L.points.map((p, i) => `<div style="display:flex;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--row);flex-wrap:wrap">
      <div style="flex:1 1 360px;min-width:0"><div style="font-weight:600">${esc(p.label || '(no label)')}${i === 0 ? ' <span class="chip">latest</span>' : ''}</div>
        <div class="faint" style="font-size:12px">${esc(p.created)} · ${p.count} item${p.count === 1 ? '' : 's'} · <span class="mono">${esc((p.project || '').split(/[\\/]/).pop())}</span></div>
        <div class="muted mono" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((p.names || []).join(', '))}</div></div>
      <button class="btn sm" data-und="${esc(p.id)}">Undo to here…</button></div>`).join('') || '<div class="empty">No restore points yet. One is saved automatically before every send.</div>'}
    </div></div><div class="faint" style="font-size:12px;margin-top:10px">Stored in <span class="mono">${esc(L.folder)}</span> · last 200 kept.</div>`;
  document.querySelectorAll('[data-und]').forEach(b => b.onclick = () => undoFlow(b.dataset.und));
}

// ───────────── start ─────────────
(async function start() {
  paintUser(); render();
  pollHelper(); setInterval(pollHelper, 5000);
  if (S.cfg.token) { loadUser(); await loadSets(); }
  else S.loaded = true;
  if (S.cap.items.length && S.view === 'library') toast('You have an unsaved capture draft — open “Capture from SM” to continue it.');
})();
</script>
